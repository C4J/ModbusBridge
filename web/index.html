<!DOCTYPE html>
<!-- Live points table. Subscribes to /events (SSE) for push updates; writable points
     (coils, holding registers) have an inline editor that PUTs /api/points/{name}, plus a
     Pulse control (POST /api/points/{name}/pulse) that sets the value, holds it for the
     given time (default 3000 ms — the relay use case), then auto-resets server-side. A
     manual Refresh button is kept as a fallback if SSE is unavailable. -->
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Commander4j Modbus Bridge</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 1.5rem; color: #222; }
    h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
    nav { margin-bottom: 1rem; font-size: .9rem; }
    nav a { margin-right: 1rem; }
    #status { padding: .5rem .75rem; border-radius: 4px; margin-bottom: 1rem; font-size: .9rem; }
    .up   { background: #e3f5e1; border: 1px solid #9ccc93; }
    .down { background: #fde2e1; border: 1px solid #e29b97; }
    table { border-collapse: collapse; width: 100%; max-width: 820px; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #e0e0e0; }
    th { background: #f4f4f4; font-weight: 600; }
    td.value { font-variant-numeric: tabular-nums; font-weight: 600; }
    tr.stale td.value { color: #b00; }
    tr.stale td.value::after { content: " (stale)"; font-weight: 400; font-size: .8rem; color: #b00; }
    .ro { color: #888; font-size: .85rem; }
    /* Simulated points (from /api/status) — live-looking to REST callers, tagged for the operator. */
    tr.sim td.kind::after { content: " · simulated"; font-size: .8rem; color: #888; font-style: italic; }
    /* restapi ids mapped onto the point (from /api/status), shown under its name. */
    .restids { display: block; font-size: .75rem; color: #888; font-style: italic; }
    input[type=number], input.coil { width: 6rem; }
    input.hold { width: 5rem; margin-left: .75rem; }
    .unit { font-size: .8rem; color: #888; margin-left: .15rem; }
    td button { margin-left: .35rem; }
    button { cursor: pointer; }
    .err { color: #b00; font-size: .85rem; margin-left: .5rem; }
    .ok  { color: #2a7d20; font-size: .85rem; margin-left: .5rem; }
    footer { margin-top: 1rem; font-size: .8rem; color: #888; }
  </style>
</head>
<body>
  <h1 id="appTitle">Commander4j Modbus Bridge</h1>
  <nav>
    <a href="/">Points</a>
    <a href="/log.html">Log</a>
    <a href="/licence.html">Licences</a>
    <button id="refresh" type="button">Refresh</button>
  </nav>

  <div id="status" class="down">Connecting…</div>

  <table>
    <thead>
      <tr><th>Name</th><th>Kind</th><th>Address</th><th>Value</th><th>Set / Pulse</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <footer id="foot"></footer>

  <script>
    const rowsEl = document.getElementById('rows');
    const statusEl = document.getElementById('status');
    const footEl = document.getElementById('foot');

    function fmtTime(ms) {
      if (!ms) return 'never';
      return new Date(ms).toLocaleTimeString();
    }

    function render(data) {
      if (data.appVersion) {
        const title = data.appName + ' ' + data.appVersion;
        document.getElementById('appTitle').textContent = title;
        document.title = title;
      }
      const conn = data.connected;
      statusEl.className = conn ? 'up' : 'down';
      statusEl.textContent = (conn ? 'Connected to '
          : (modbusDisabled ? 'Modbus link disabled in config — target ' : 'Disconnected — target '))
        + data.target + ' (unit ' + data.unitId + ')'
        + ' · last poll ' + fmtTime(data.lastPollMillis);

      for (const p of data.points) {
        let row = document.getElementById('pt-' + p.name);
        if (!row) {
          row = buildRow(p);
          rowsEl.appendChild(row);
        }
        row.classList.toggle('stale', !!p.stale);
        row.classList.toggle('sim', simulatedSet.has(p.name));
        const ids = restIdMap[p.name] || [];
        row.querySelector('.restids').textContent = ids.length ? 'ids: ' + ids.join(', ') : '';
        const valCell = row.querySelector('.value');
        valCell.textContent = p.valid ? p.value : '—';
        // Don't clobber an input the user is actively editing.
        const input = row.querySelector('input');
        if (input && document.activeElement !== input) {
          input.value = p.value;
        }
      }
      footEl.textContent = data.points.length + ' point(s)';
    }

    function buildRow(p) {
      const tr = document.createElement('tr');
      tr.id = 'pt-' + p.name;
      tr.innerHTML =
        '<td>' + escapeHtml(p.name) + '<span class="restids"></span></td>' +
        '<td class="kind">' + escapeHtml(p.kind) + '</td>' +
        '<td>' + p.address + '</td>' +
        '<td class="value"></td>' +
        '<td class="setcell"></td>';
      const setCell = tr.querySelector('.setcell');
      if (p.writable) {
        const input = document.createElement('input');
        if (p.bit) {
          input.type = 'number'; input.min = 0; input.max = 1; input.step = 1; input.className = 'coil';
        } else {
          input.type = 'number'; input.min = 0; input.max = 65535; input.step = 1;
        }
        const btn = document.createElement('button');
        btn.type = 'button'; btn.textContent = 'Set';
        const msg = document.createElement('span');
        btn.addEventListener('click', () => writePoint(p.name, input.value, msg));
        input.addEventListener('keydown', e => { if (e.key === 'Enter') writePoint(p.name, input.value, msg); });
        setCell.appendChild(input);
        setCell.appendChild(btn);
        // Pulse: set the value, hold for the given time, auto-reset server-side. The
        // reset is owned by the bridge, so closing the page mid-hold is safe. Bounds and
        // the pre-fill come from the point's config (minHoldMs/maxHoldMs/defaultHoldMs) —
        // absent entirely when the point is configured pulse="false", so no Pulse control.
        if (p.minHoldMs !== undefined) {
          const hold = document.createElement('input');
          hold.type = 'number'; hold.min = p.minHoldMs; hold.max = p.maxHoldMs;
          hold.step = 100; hold.value = p.defaultHoldMs;
          hold.className = 'hold';
          hold.title = 'hold time in ms (' + p.minHoldMs + '–' + p.maxHoldMs + ') before the automatic reset';
          const ms = document.createElement('span');
          ms.className = 'unit'; ms.textContent = 'ms';
          const pbtn = document.createElement('button');
          pbtn.type = 'button'; pbtn.textContent = 'Pulse';
          pbtn.title = 'set the value, hold, then reset automatically';
          pbtn.addEventListener('click', () => pulsePoint(p.name, input.value, hold.value, msg));
          setCell.appendChild(hold);
          setCell.appendChild(ms);
          setCell.appendChild(pbtn);
        }
        setCell.appendChild(msg);
      } else {
        setCell.innerHTML = '<span class="ro">read-only</span>';
      }
      return tr;
    }

    async function writePoint(name, value, msgEl) {
      msgEl.textContent = '';
      const n = parseInt(value, 10);
      if (Number.isNaN(n)) { msgEl.className = 'err'; msgEl.textContent = 'not a number'; return; }
      try {
        const res = await fetch('/api/points/' + encodeURIComponent(name), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: n })
        });
        if (res.ok) {
          msgEl.className = 'ok'; msgEl.textContent = '✓';
          setTimeout(() => { msgEl.textContent = ''; }, 1500);
        } else {
          const body = await res.json().catch(() => ({}));
          msgEl.className = 'err'; msgEl.textContent = (res.status + ' ' + (body.error || res.statusText));
        }
      } catch (e) {
        msgEl.className = 'err'; msgEl.textContent = e.message;
      }
    }

    async function pulsePoint(name, value, holdMs, msgEl) {
      msgEl.textContent = '';
      const n = parseInt(value, 10);
      const h = parseInt(holdMs, 10);
      if (Number.isNaN(n)) { msgEl.className = 'err'; msgEl.textContent = 'value is not a number'; return; }
      if (Number.isNaN(h) || h < 1) { msgEl.className = 'err'; msgEl.textContent = 'bad hold time'; return; }
      try {
        const res = await fetch('/api/points/' + encodeURIComponent(name) + '/pulse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: n, holdMs: h })
        });
        if (res.ok) {
          msgEl.className = 'ok'; msgEl.textContent = '✓ pulsing ' + h + ' ms';
          setTimeout(() => { msgEl.textContent = ''; }, h + 1500);
        } else {
          const body = await res.json().catch(() => ({}));
          msgEl.className = 'err'; msgEl.textContent = (res.status + ' ' + (body.error || res.statusText));
        }
      } catch (e) {
        msgEl.className = 'err'; msgEl.textContent = e.message;
      }
    }

    async function refresh() {
      try {
        const res = await fetch('/api/points');
        render(await res.json());
      } catch (e) {
        statusEl.className = 'down';
        statusEl.textContent = 'Refresh failed: ' + e.message;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    document.getElementById('refresh').addEventListener('click', refresh);

    // Operator-only diagnostics: which points are simulated, whether the Modbus link is
    // switched off in config, and each point's restapi ids. Deliberately NOT part of the
    // points payload — the client<->bridge conversation must not reveal simulation — so
    // fetch it separately.
    let simulatedSet = new Set();
    let restIdMap = {};
    let modbusDisabled = false;
    fetch('/api/status').then(r => r.json()).then(s => {
      simulatedSet = new Set(s.simulatedPoints || []);
      restIdMap = s.restIds || {};
      modbusDisabled = (s.modbusEnabled === false);
      refresh(); // re-render so existing rows pick up the tags
    }).catch(() => {});

    // Live push via SSE; fall back to an initial fetch so the table fills even if SSE
    // never connects.
    refresh();
    const es = new EventSource('/events');
    es.onmessage = e => { try { render(JSON.parse(e.data)); } catch (_) {} };
    es.onerror = () => { statusEl.className = 'down'; /* browser auto-reconnects */ };
  </script>
</body>
</html>
